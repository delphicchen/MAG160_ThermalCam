# Stage 1 — L1 warm-up, no adversarial loss (the "RealESRNet" phase).
# Start from realesr-general-x4v3 and let the network adapt to the thermal degradation
# before the discriminator gets a vote. ~10k iterations is enough; longer mostly blurs.
name: thermal_srvgg_x4_net
model_type: ThermalRealESRNetModel
scale: 4
num_gpu: 1
manual_seed: 0

# ---- degradation, stage 1 of 2 -------------------------------------------------------
# Changes vs finetune_realesrgan_x4plus.yml, and why:
#  * blur_sigma 0.2–1.5 (was 0.2–3.0): the fixed 6.5 mm lens is always in focus and the
#    sensor is already the resolution limit — heavy blur is not a degradation this camera
#    produces, and training on it costs sharpness.
#  * sinc_prob 0 (was 0.1): sinc ringing models a resampling filter in a photo pipeline.
#    The thermal path has none, and ringing halos next to a hot edge read as fake
#    temperature.
#  * noise stronger and Poisson-weighted (gaussian_prob 0.3 vs 0.5, poisson 1–3.0):
#    microbolometer noise is dominated by shot/thermal noise that scales with signal.
#  * gray_noise_prob high: the sensor is single-channel, so its noise is identical in
#    R, G and B after we replicate the grey frame.
#  * jpeg_range kept but mild — the SDK path has no JPEG, this only adds robustness.
#  * FPN + low-contrast: added by ThermalRealESRNetModel, see archs/thermal_degradation.py
resize_prob: [0.2, 0.7, 0.1]   # up, down, keep
resize_range: [0.3, 1.5]
gaussian_noise_prob: 0.3
noise_range: [1, 25]
poisson_scale_range: [0.05, 3.0]
gray_noise_prob: 0.6
jpeg_range: [50, 95]

second_blur_prob: 0.5
resize_prob2: [0.3, 0.6, 0.1]
resize_range2: [0.5, 1.2]
gaussian_noise_prob2: 0.3
noise_range2: [1, 15]
poisson_scale_range2: [0.05, 2.0]
gray_noise_prob2: 0.6
jpeg_range2: [60, 95]

gt_size: 256
queue_size: 180

# USM-sharpened ground truth. Stock Real-ESRGAN trains against a sharpened GT, which
# teaches the network to overshoot edges — pleasant on photos, but on a thermal frame an
# overshoot beside a hot edge reads as a temperature that is not there. Trained against
# the true GT instead; the fake-hot-spot check in scripts/hallucination_check.py is what
# this is protecting.
gt_usm: false

# ---- thermal FPN (our addition) ------------------------------------------------------
# Defaults are what scripts/estimate_fpn_stats.py measured on a MAG160Core; re-measure
# for your own unit and paste the numbers here.
# Rows as strong as columns (and the gain pattern on a random axis, in the code): one
# model serves every mounting — the app rotates 0/90/180/270 before upscaling, so the
# sensor's columns can arrive as rows.
fpn_prob: 0.9
fpn_col_sigma: [0.0, 0.010]
fpn_row_sigma: [0.0, 0.010]
fpn_map_sigma: [0.0, 0.006]
fpn_gain_sigma: [0.0, 0.004]
contrast_range: [0.45, 1.0]

datasets:
  train:
    name: thermal_hr
    type: RealESRGANDataset
    dataroot_gt: datasets/thermal_hr
    meta_info: datasets/meta_info/thermal_hr.txt
    io_backend:
      type: disk

    blur_kernel_size: 15
    kernel_list: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob: [0.50, 0.25, 0.10, 0.05, 0.07, 0.03]
    sinc_prob: 0
    blur_sigma: [0.2, 1.5]
    betag_range: [0.5, 4]
    betap_range: [1, 2]

    blur_kernel_size2: 11
    kernel_list2: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob2: [0.50, 0.25, 0.10, 0.05, 0.07, 0.03]
    sinc_prob2: 0
    blur_sigma2: [0.2, 1.0]
    betag_range2: [0.5, 4]
    betap_range2: [1, 2]

    final_sinc_prob: 0

    gt_size: 256
    use_hflip: true
    use_rot: false          # thermal scenes have a gravity direction; keep it

    use_shuffle: true
    num_worker_per_gpu: 5
    batch_size_per_gpu: 12
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

# Validation is visual: 20 held-out real MAG160Core frames, no ground truth exists at 4x.
# BasicSR needs paired data for metrics, so we score nothing here and instead dump
# comparison grids with scripts/hallucination_check.py at each checkpoint.

# 1-channel in/out: the thermal field is grey (the data path stays RGB for DiffJPEG; the
# model classes cut to one channel at the boundary). 64/8: half the body of the first
# release's 64/16, which ran at 75-92 ms on the phone — too slow for 15 fps.
network_g:
  type: SRVGGNetCompact
  num_in_ch: 1
  num_out_ch: 1
  num_feat: 64
  num_conv: 8
  upscale: 4
  act_type: prelu

path:
  # Remapped by scripts/truncate_pretrained.py: the published model is 3-channel 64/32;
  # the script keeps the first 8 body convs, moves the real output conv onto ours and
  # folds RGB into one channel. Every key then matches, so load strictly — a mismatch
  # must fail here, not be skipped with a warning.
  pretrain_network_g: experiments/pretrained_models/realesr-general-x4v3-conv8-grey.pth
  param_key_g: params
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [6000]
    gamma: 0.5

  total_iter: 10000
  warmup_iter: -1

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 2e3
  use_tb_logger: true

dist_params:
  backend: nccl
  port: 29500
